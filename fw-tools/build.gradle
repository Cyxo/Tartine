// Dev-time framework tooling: locates the LOCAL SDK android.jar (API 36),
// parses it into the framework index, and generates the framework module's
// android.* skeletons.
//
// This module is never on the runtime classpath. android.jar is a build input
// for skeleton regeneration only; the runtime never reads it
// (docs/architecture.md).
plugins {
    id 'java'
}

repositories {
    mavenCentral()
    google() // the root project's smali-dexlib2 resolves from Google Maven
}

dependencies {
    // SkeletonGen reads DEX descriptors through the runtime's shared helper.
    implementation project(':')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Regenerate the framework module's android.* skeletons from the local API 36
// android.jar (additive by default; --force overwrites). Committed output.
tasks.register('fwGen', JavaExec) {
    group = 'framework'
    description = 'Emit framework skeletons (UOE bodies) into framework/src/main/java'
    mainClass = 'tartine.sdk.SkeletonGen'
    classpath = sourceSets.main.runtimeClasspath
    args = [rootProject.file('framework/src/main/java').path]
    environment 'ANDROID_HOME': (System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT') ?: '')
}