// Framework module: real Java implementations of the android.* API surface.
// Skeletons are generated from the LOCAL SDK android.jar (exact signatures,
// see tartine.fw.SkeletonGen and the mise task fw-gen); behavior is written
// into those skeletons. Every unimplemented body throws
// UnsupportedOperationException("Tartine: not implemented: <signature>") so
// the gap-driven loop survives (AGENTS.md "Framework in Java").
plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    // Skia renderer backend for android.graphics (Canvas/RenderNode etc.).
    // The main module declares the platform jars as runtimeOnly so both join
    // the same classpath at launch.
    implementation 'io.github.humbleui:skija-shared:0.143.18'

    // Framework tests stay native-free: only skija-shared is on this
    // module's classpath (no skija-<platform> runtime jars), so a test that
    // reaches a Skija native fails here instead of on a user machine.
    // The seam tests use gfx-api's RecordingBackend, so they need no renderer
    // at all.
    testImplementation project(':gfx-api')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.named('test', Test) {
    useJUnitPlatform()
}
