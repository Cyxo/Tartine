// Framework module: real Java implementations of the android.* API surface.
// Skeletons are generated from the LOCAL SDK android.jar (exact signatures,
// see tartine.sdk.SkeletonGen and the mise task fw-gen); behavior is written
// into those skeletons. Every unimplemented body throws
// UnsupportedOperationException("Tartine: not implemented: <signature>") so
// the gap-driven loop survives (AGENTS.md "Framework in Java").
plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    // Renderer seam only: the framework never imports Skija. gfx-skija
    // supplies the implementation at runtime; tests use a recording backend
    // over gfx-api and stay native-free.
    api project(':gfx-api')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.named('test', Test) {
    useJUnitPlatform()
}
