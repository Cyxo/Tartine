[tools]
java = "corretto-27.0.0.35.1"
gradle = "9.8.1"
powershell = { version = "7.6.6", os = ["windows"] }

[tasks.fetch-tools]
description = "Download dev-time oracle JARs into tools/ (idempotent)"
run = "bash scripts/fetch-tools.sh"
run_windows = "pwsh -File scripts/fetch-tools.ps1"

[tasks.build]
description = "Incremental compile + refresh launch classpath + framework jar"
run = "gradle compileTestJava :framework:jar writeClasspath"

[tasks.test]
description = "Run the JUnit suite"
run = "gradle test"

[tasks.apk]
description = "APK summary: manifest, code, libraries (headless)"
depends = ["build"]
usage = 'arg "[apk]" default="apks/app-debug.apk" help="APK file to inspect"'
run = "bash scripts/apk.sh"
run_windows = "pwsh -File scripts/apk.ps1"

[tasks.run]
description = "Headless probe: run launcher onCreate until the first gap"
depends = ["build"]
usage = 'arg "[apk]" default="apks/app-debug.apk" help="APK file to probe"'
run = "bash scripts/run.sh"
run_windows = "pwsh -File scripts/run.ps1"

[tasks.gui]
description = "GUI probe: headless onCreate, then show the activity window"
depends = ["build"]
usage = '''arg "[apk]" default="apks/app-debug.apk" help="APK file to show"
  arg "[timeout]" default="0" help="Auto-close after N seconds (0 = stay open)"'''
run = "bash scripts/gui.sh"
run_windows = "pwsh -File scripts/gui.ps1"

[tasks.dump]
description = "Print the instruction dump of one dex file"
depends = ["build"]
usage = 'arg "<dex>" help="Dex file to dump"'
run = "bash scripts/dump.sh"
run_windows = "pwsh -File scripts/dump.ps1"

[tasks.'fw-gen']
description = "Regenerate framework skeletons from the local android.jar (adds classes not yet on disk)"
depends = ["build"]
run = "gradle fwGen"
