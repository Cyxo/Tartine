plugins {
    id 'java'
    id 'application'
}

group = 'tartine'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
    google() // com.android.tools.smali:* (dexlib2 fork) publishes here only
}

dependencies {
    implementation 'com.android.tools.smali:smali-dexlib2:3.0.10'
    implementation 'com.google.guava:guava:31.1-android' // dexlib2 3.0.10 requires >= 31.1
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    // Real Java implementations of android.* (generated skeletons + behavior).
    implementation project(':framework')
    // Desktop windowing (GLFW) + GL for the GUI step (BSD-3-Clause).
    def lwjglVersion = '3.4.3'
    for (name in ['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl']) {
        implementation "org.lwjgl:$name:$lwjglVersion"
    }
    // Natives for every desktop host; LWJGL picks its own at runtime.
    for (platform in ['natives-windows', 'natives-linux', 'natives-macos',
            'natives-macos-arm64']) {
        for (name in ['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl']) {
            runtimeOnly "org.lwjgl:$name:$lwjglVersion:$platform"
        }
    }
    // Skia via Skija (Java bindings; Apache-2.0) backs android.graphics.Canvas
    // drawing (AGENTS.md decision 2026-10-18: Skia for UI draws, not pure GL).
    implementation 'io.github.humbleui:skija-shared:0.143.18'
    // Translation spike: DEX -> JVM bytecode emitter (BSD-3-Clause).
    implementation 'org.ow2.asm:asm:9.6'
    implementation 'org.ow2.asm:asm-tree:9.6'
    implementation 'org.ow2.asm:asm-analysis:9.6'
    implementation 'org.ow2.asm:asm-util:9.6'
    runtimeOnly 'io.github.humbleui:skija-windows-x64:0.143.18'
    runtimeOnly 'io.github.humbleui:skija-windows-arm64:0.143.18'
    runtimeOnly 'io.github.humbleui:skija-linux-x64:0.143.18'
    runtimeOnly 'io.github.humbleui:skija-linux-arm64:0.143.18'
    runtimeOnly 'io.github.humbleui:skija-macos-x64:0.143.18'
    runtimeOnly 'io.github.humbleui:skija-macos-arm64:0.143.18'
    // SVG rendering for converted Android vector drawables (window icons;
    // MIT). Used by IntelliJ/NetBeans/Eclipse SWT upstream.
    implementation 'com.github.weisj:jsvg:2.2.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

// Java 21 language/API level on every compile; never use source/target instead.
tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // `gradle test` is the repo-wide verification entry point; framework
    // tests live in their own module so they run without the runtime's
    // Skija platform natives.
    dependsOn ':framework:test'
}

application {
    mainClass = 'tartine.Main'
}

// Absolute dependency jars, one per line, for the direct-java launchers
// (mise-tasks/*). Refresh with `mise run build`; never hand-edit.
tasks.register('writeClasspath') {
    def outFile = layout.buildDirectory.file('runtime-classpath.txt')
    outputs.file(outFile)
    doLast {
        outFile.get().asFile.text = sourceSets.main.runtimeClasspath.files
                .findAll { it.name.endsWith('.jar') }.join('\n') + '\n'
    }
}

// Regenerate the framework module's android.* skeletons from the local
// android.jar (additive by default; --force overwrites). Committed output.
tasks.register('fwGen', JavaExec) {
    group = 'framework'
    description = 'Emit framework skeletons (UOE bodies) into framework/src/main/java'
    mainClass = 'tartine.fw.SkeletonGen'
    classpath = sourceSets.main.runtimeClasspath
    args = [layout.projectDirectory.dir('framework/src/main/java').asFile.path]
    environment 'ANDROID_HOME': (System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT') ?: '')
}

